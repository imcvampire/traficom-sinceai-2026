[tools]
python = "3.12"
uv = "0.12.22"
bun = "1.4.2"
node = "24.22.2"

[env]
UV_PYTHON_PREFERENCE = "only-system"
UV_PYTHON_DOWNLOADS = "never"

[tasks.mdbtools]
description = "Install mdbtools (mdb-export) with the system package manager if it is missing"
run = '''
set -eu
if command -v mdb-export >/dev/null 2>&1; then
  exit 0
fi
if command -v brew >/dev/null 2>&1; then
  brew install mdbtools
elif command -v apt-get >/dev/null 2>&1; then
  sudo apt-get update && sudo apt-get install -y mdbtools
elif command -v dnf >/dev/null 2>&1; then
  sudo dnf install -y mdbtools
else
  echo "mdbtools not found and no supported package manager (brew, apt-get, dnf); install it manually" >&2
  exit 1
fi
command -v mdb-export >/dev/null 2>&1 || { echo "mdb-export still not on PATH after install" >&2; exit 1; }
'''

[tasks.install]
description = "Install mdbtools, backend and frontend dependencies"
depends = ["mdbtools"]
run = [
  "uv sync --project backend",
  "bun install --cwd frontend",
]

[tasks.api]
description = "Run the API server with reload"
dir = "backend"
run = "uv run ific serve --reload"

[tasks.web]
description = "Run the Vite dev server"
dir = "frontend"
run = "bun run dev"

[tasks.dev]
description = "Run API and web dev servers together"
depends = ["api", "web"]

[tasks.test]
description = "Run backend tests"
dir = "backend"
run = "uv run pytest -q"

[tasks.lint]
description = "Lint and format-check backend and frontend"
run = [
  "uv run --project backend ruff check backend",
  "uv run --project backend ruff format --check backend",
  "bun run --cwd frontend lint",
]

[tasks.build]
description = "Build the frontend"
dir = "frontend"
run = "bun run build"
